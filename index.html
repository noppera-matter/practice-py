<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>마음 보호 10분 매뉴얼</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    :root {
        --primary: #1e3a8a;
        --accent: #f59e0b;
        --text: #0f172a;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, 'Nanum Gothic', sans-serif;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, #e0e7ff 0%, #fef3c7 100%);
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: var(--text);
    }

    #root {
        width: 100%;
        max-width: 450px;
        height: 100%;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .app-frame {
        width: 100%;
        height: 95%;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 2px solid white;
        position: relative;
    }

    .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
    }

    .center-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
    }

    .scrollable {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .timer-header {
        padding: 30px 25px 15px;
        background: #1e293b;
        color: white;
        border-radius: 0 0 30px 30px;
    }

    .timer-val {
        font-size: 36px;
        font-weight: 900;
        color: #22d3ee;
        font-family: monospace;
    }

    .prog-bg {
        height: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        margin-top: 15px;
        overflow: hidden;
    }

    .prog-fill {
        height: 100%;
        background: var(--accent);
        transition: width 1s linear;
    }

    .mission-card {
        background: white;
        margin: 20px;
        border-radius: 30px;
        padding: 35px 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 320px;
    }

    .success-card {
        background: white;
        width: 100%;
        border-radius: 30px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        margin-top: 25px;
    }

    .btn-action {
        background: var(--primary);
        color: white;
        border: none;
        padding: 20px;
        border-radius: 20px;
        font-size: 18px;
        font-weight: 900;
        margin: 10px 20px 20px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 8px 15px rgba(92, 107, 192, 0.2);
        width: calc(100% - 40px);
    }

    .btn-action:active { transform: scale(0.96); }

    .game-board {
        background: #bbada0;
        width: 280px;
        height: 280px;
        border-radius: 12px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 20px auto;
        touch-action: none;
    }

    .tile {
        width: 58px;
        height: 58px;
        background: rgba(238, 228, 218, 0.35);
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 900;
        font-size: 18px;
        color: #776e65;
    }

    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { background: #f2b179; color: white; }

    .sudoku-board {
        background: #bbada0;
        width: 300px;
        height: 300px;
        border-radius: 10px;
        padding: 5px;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 2px;
        margin: 20px auto;
    }

    .sudoku-cell {
        background: #eee4da;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
        color: #776e65;
        cursor: pointer;
    }

    .sudoku-cell.fixed { background: #cdc1b4; }
    .sudoku-cell.selected { background: #f2b179; color: white; }

    .sudoku-numpad {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        width: 300px;
        margin: 0 auto;
    }

    .sudoku-num-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .sudoku-num-btn:active { transform: scale(0.95); }

    /* ── 코드 공부 스타일 ── */
    .quiz-header {
        padding: 18px 20px 14px;
        background: #0f172a;
        color: white;
        flex-shrink: 0;
    }

    .quiz-prog-bar {
        height: 6px;
        background: rgba(255,255,255,0.15);
        border-radius: 6px;
        margin-top: 10px;
        overflow: hidden;
    }

    .quiz-prog-fill {
        height: 100%;
        background: #22d3ee;
        transition: width 0.3s;
    }

    .code-block {
        background: #1e293b;
        color: #e2e8f0;
        border-radius: 14px;
        padding: 16px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
        margin: 4px 0 10px;
    }

    .quiz-opt {
        width: 100%;
        text-align: left;
        padding: 14px 16px;
        border-radius: 14px;
        border: 2px solid #e2e8f0;
        background: white;
        font-size: 14px;
        line-height: 1.5;
        cursor: pointer;
        margin-bottom: 8px;
        transition: 0.15s;
        color: var(--text);
    }

    .quiz-opt:active { transform: scale(0.98); }
    .quiz-opt.correct { background: #dcfce7; border-color: #16a34a; color: #15803d; font-weight: bold; }
    .quiz-opt.wrong   { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
    .quiz-opt.dim     { opacity: 0.45; }

    .explain-box {
        background: #f0f9ff;
        border-left: 4px solid #0ea5e9;
        border-radius: 0 12px 12px 0;
        padding: 14px;
        font-size: 14px;
        line-height: 1.6;
        color: #0c4a6e;
        margin-top: 8px;
    }

    .wrong-card {
        background: white;
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        text-align: left;
    }

    .tag {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .tag-role    { background: #fef3c7; color: #92400e; }
    .tag-concept { background: #ede9fe; color: #5b21b6; }

    .study-menu-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: calc(100% - 40px);
        margin: 8px 20px 0;
        padding: 18px 20px;
        border-radius: 20px;
        border: none;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
        text-align: left;
    }

    .study-menu-btn:active { transform: scale(0.97); }

    .result-circle {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 8px solid var(--primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
    }

    .fade-in { animation: fadeIn 0.4s ease-out; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .bounce { animation: bounce 2s infinite; }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-10px); }
    }

    .wobble {
        animation: wobble 1.5s infinite ease-in-out;
        display: inline-block;
        transform-origin: bottom center;
    }

    @keyframes wobble {
        0%, 100% { transform: rotate(0deg); }
        25%       { transform: rotate(-10deg); }
        75%       { transform: rotate(10deg); }
    }
</style>
</head>

                '서버에 데이터를 전송한다',

        {

            ans: 1,
            exp: '의존성 배열이 []이면 최초 마운트 시 1회만 실행됩니다. 배열을 생략하면 매 렌더링마다, 특정 값을 넣으면 그 값이 바뀔 때 실행됩니다.'

        {

            q: 'useCallback과 useMemo의 차이는?',

    const generateSudoku = () => {
        const board = Array(81).fill(0);
        const isValid = (b, pos, num) => {
            const row = Math.floor(pos / 9), col = pos % 9;
            for (let c = 0; c < 9; c++) if (b[row * 9 + c] === num) return false;
            for (let r = 0; r < 9; r++) if (b[r * 9 + col] === num) return false;
            const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
            for (let r = br; r < br + 3; r++)
                for (let c = bc; c < bc + 3; c++)
                    if (b[r * 9 + c] === num) return false;
            return true;
        };
        const shuffle = arr => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };
        const solve = (b, pos = 0) => {
            if (pos === 81) return true;
            if (b[pos] !== 0) return solve(b, pos + 1);
            for (const num of shuffle([1,2,3,4,5,6,7,8,9])) {
                if (isValid(b, pos, num)) {
                    b[pos] = num;
                    if (solve(b, pos + 1)) return true;
                    b[pos] = 0;
                }
            }
            return false;
        };
        solve(board);
        const solution = [...board];
        const n = 40 + Math.floor(Math.random() * 11);
        shuffle([...Array(81).keys()]).slice(0, n).forEach(i => board[i] = 0);
        return { puzzle: board, solution };
    };

                            </div>
                        </div>
                        <button className="btn-action" style={{ background: '#94a3b8' }} onClick={() => setView('HOME')}>
                            그만두기
                        </button>
                    </div>
                )}

                {/* ── SUDOKU ── */}
                {view === 'SUDOKU' && (
                    <div className="screen fade-in" style={{ paddingTop: 20 }}>
                        <div style={{ textAlign: 'center' }}>
                            {selectedTemp && (
                                <div style={{ color: '#1e3a8a', fontWeight: 'bold', margin: '20px 0 10px', fontSize: 16 }}>
                                    집사야, {selectedTemp}
                                </div>
                            )}
                            <h3 style={{ margin: '10px 0' }}>스도쿠 퍼즐</h3>
                            <div className="sudoku-board">
                                {sudokuBoard.map((val, i) => (
                                    <div key={i}
                                        className={`sudoku-cell ${sudokuFixed[i] ? 'fixed' : ''} ${sudokuSelected === i ? 'selected' : ''}`}
                                        style={{
                                            borderRight:  i % 3 === 2 && i % 9 !== 8 ? '2px solid #776e65' : 'none',
                                            borderBottom: Math.floor(i / 9) % 3 === 2 && Math.floor(i / 9) !== 8 ? '2px solid #776e65' : 'none'
                                        }}
                                        onClick={() => !sudokuFixed[i] && setSudokuSelected(i)}>
                                        {val !== 0 ? val : ''}
                                    </div>
                                ))}
                            </div>
                            <div className="sudoku-numpad">
                                {[1,2,3,4,5,6,7,8,9,'지우기'].map(num => (
                                    <button key={num} className="sudoku-num-btn"
                                        onClick={() => {
                                            if (sudokuSelected !== -1 && !sudokuFixed[sudokuSelected]) {
                                                if (num === '지우기') {
                                                    const nb = [...sudokuBoard]; nb[sudokuSelected] = 0; setSudokuBoard(nb);
                                                } else if (num === sudokuSolution[sudokuSelected]) {
                                                    const nb = [...sudokuBoard]; nb[sudokuSelected] = num; setSudokuBoard(nb);
                                                    confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
                                                    if (nb.join('') === sudokuSolution.join('')) {
                                                        setTimeout(() => { confetti({ particleCount: 150, spread: 70 }); setView('FINAL_SUCCESS'); }, 500);
                                                    }
                                                } else {
                                                    alert("앗! 오답이다냥 😿 다시 생각해보라냥!");
                                                }
                                            }
                                        }}>
                                        {num}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <button className="btn-action" style={{ background: '#94a3b8', marginTop: 20 }}
                            onClick={() => setView('HOME')}>
                            그만두기
                        </button>
                    </div>
                )}

                {/* ════════════════════════
                    코드 공부 뷰들
                ════════════════════════ */}

                {/* ── STUDY_HOME ── */}
                {view === 'STUDY_HOME' && (
                    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                        <div style={{ padding: '30px 20px 16px', background: '#0f172a', color: 'white', borderRadius: '0 0 28px 28px', flexShrink: 0 }}>
                            <div style={{ fontSize: 13, color: '#94a3b8', marginBottom: 6 }}>CODE STUDY</div>
                            <h2 style={{ margin: 0, fontSize: 22 }}>📖 코드 공부</h2>
                            <div style={{ fontSize: 13, color: '#64748b', marginTop: 8 }}>
                                이 파일의 코드를 얼마나 이해하고 있나요?
                            </div>
                        </div>

                        <div style={{ flex: 1, overflowY: 'auto', padding: '20px 0 10px' }}>
                            <button className="study-menu-btn"
                                style={{ background: '#eff6ff', color: '#1e3a8a' }}
                                onClick={() => startQuiz('all')}>
                                <span style={{ fontSize: 28 }}>📝</span>
                                <div>
                                    <div style={{ fontWeight: 900 }}>전체 퀴즈</div>
                                    <div style={{ fontSize: 12, color: '#64748b', fontWeight: 400 }}>개념 + 코드 역할 {QUIZ_BANK.length}문제</div>
                                </div>
                            </button>

                            <button className="study-menu-btn"
                                style={{ background: '#fefce8', color: '#713f12' }}
                                onClick={() => startQuiz('role')}>
                                <span style={{ fontSize: 28 }}>🔍</span>
                                <div>
                                    <div style={{ fontWeight: 900 }}>코드 역할 체크</div>
                                    <div style={{ fontSize: 12, color: '#92400e', fontWeight: 400 }}>코드 스니펫 보고 역할 맞추기</div>
                                </div>
                            </button>

                            <button className="study-menu-btn"
                                style={{ background: wrongList.length > 0 ? '#fff1f2' : '#f8fafc', color: wrongList.length > 0 ? '#9f1239' : '#94a3b8' }}
                                onClick={() => setView('WRONG_NOTES')}>
                                <span style={{ fontSize: 28 }}>📚</span>
                                <div>
                                    <div style={{ fontWeight: 900 }}>
                                        오답 노트
                                        {wrongList.length > 0 && (
                                            <span style={{ marginLeft: 8, background: '#e11d48', color: 'white', borderRadius: 20, padding: '2px 8px', fontSize: 12 }}>
                                                {wrongList.length}개
                                            </span>
                                        )}
                                    </div>
                                    <div style={{ fontSize: 12, fontWeight: 400 }}>틀린 문제만 모아보기</div>
                                </div>
                            </button>

                            {wrongList.length > 0 && (
                                <button className="study-menu-btn"
                                    style={{ background: '#fdf4ff', color: '#6b21a8' }}
                                    onClick={() => startQuiz('wrong')}>
                                    <span style={{ fontSize: 28 }}>🔄</span>
                                    <div>
                                        <div style={{ fontWeight: 900 }}>오답만 다시 풀기</div>
                                        <div style={{ fontSize: 12, color: '#7e22ce', fontWeight: 400 }}>틀린 {wrongList.length}문제 집중 복습</div>
                                    </div>
                                </button>
                            )}
                        </div>

                        <button className="btn-action"
                            style={{ background: 'transparent', color: '#94a3b8', boxShadow: 'none', border: '1.5px solid #e2e8f0', marginBottom: 20 }}
                            onClick={() => setView('HOME')}>
                            ← 뒤로
                        </button>
                    </div>
                )}

                {/* ── CODE_QUIZ ── */}
                {view === 'CODE_QUIZ' && currentQ && (
                    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                        {/* 헤더 */}
                        <div className="quiz-header">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span style={{ fontSize: 12, color: '#94a3b8' }}>
                                    {quizMode === 'role' ? '🔍 코드 역할 체크' : quizMode === 'wrong' ? '🔄 오답 복습' : '📝 전체 퀴즈'}
                                </span>
                                <span style={{ fontSize: 13, color: '#e2e8f0', fontWeight: 'bold' }}>
                                    {quizIdx + 1} / {quizQs.length}
                                </span>
                            </div>
                            <div className="quiz-prog-bar">
                                <div className="quiz-prog-fill" style={{ width: `${((quizIdx + (chosen !== null ? 1 : 0)) / quizQs.length) * 100}%` }}></div>
                            </div>
                        </div>

                        {/* 문제 영역 (스크롤) */}
                        <div className="scrollable" style={{ padding: '16px 20px' }}>
                            <span className={`tag ${currentQ.type === 'role' ? 'tag-role' : 'tag-concept'}`}>
                                {currentQ.type === 'role' ? '코드 역할' : '개념'}
                            </span>

                            {currentQ.code && (
                                <div className="code-block">{currentQ.code}</div>
                            )}

                            <p style={{ fontWeight: 700, fontSize: 16, lineHeight: 1.6, margin: '4px 0 16px', color: '#0f172a' }}>
                                {currentQ.q}
                            </p>

                            {currentQ.opts.map((opt, i) => {
                                let cls = 'quiz-opt';
                                if (chosen !== null) {
                                    if (i === currentQ.ans) cls += ' correct';
                                    else if (i === chosen) cls += ' wrong';
                                    else cls += ' dim';
                                }
                                return (
                                    <button key={i} className={cls} onClick={() => handleAnswer(i)}>
                                        <span style={{ marginRight: 10, fontWeight: 'bold', color: '#94a3b8' }}>
                                            {['①','②','③','④'][i]}
                                        </span>
                                        {opt}
                                    </button>
                                );
                            })}

                            {chosen !== null && (
                                <div>
                                    <div style={{ fontWeight: 900, fontSize: 17, margin: '14px 0 8px', color: chosen === currentQ.ans ? '#16a34a' : '#dc2626' }}>
                                        {chosen === currentQ.ans ? '✅ 정답!' : '❌ 오답 — 오답 노트에 저장됐어요'}
                                    </div>
                                    <div className="explain-box">{currentQ.exp}</div>
                                </div>
                            )}
                        </div>

                        {/* 다음 버튼 */}
                        {chosen !== null && (
                            <button className="btn-action" style={{ flexShrink: 0, marginBottom: 20 }} onClick={nextQuestion}>
                                {quizIdx < quizQs.length - 1 ? '다음 문제 →' : '결과 보기 →'}
                            </button>
                        )}
                    </div>
                )}

                {/* ── QUIZ_RESULT ── */}
                {view === 'QUIZ_RESULT' && (
                    <div className="center-screen fade-in">
                        <div className="result-circle">
                            <div style={{ fontSize: 28, fontWeight: 900, color: 'var(--primary)', lineHeight: 1 }}>
                                {quizQs.length - sessionWrong.length}
                            </div>
                            <div style={{ fontSize: 13, color: '#64748b' }}>/ {quizQs.length}</div>
                        </div>

                        <h2 style={{ margin: '0 0 6px', color: '#0f172a' }}>
                            {sessionWrong.length === 0 ? '완벽해요! 🎉' : `${sessionWrong.length}개 틀렸어요`}
                        </h2>
                        <p style={{ color: '#64748b', marginBottom: 24, fontSize: 14 }}>
                            {sessionWrong.length === 0
                                ? '이 파일의 코드를 완벽하게 이해하고 있어요!'
                                : '틀린 문제는 오답 노트에 자동 저장됐어요.'}
                        </p>

                        {wrongList.length > 0 && (
                            <button className="btn-action" style={{ background: '#9f1239', marginBottom: 0 }}
                                onClick={() => setView('WRONG_NOTES')}>
                                📚 오답 노트 보기 ({wrongList.length}개)
                            </button>
                        )}
                        <button className="btn-action"
                            style={{ background: 'white', color: 'var(--primary)', border: '2px solid var(--primary)', marginTop: 0 }}
                            onClick={() => startQuiz(quizMode)}>
                            🔄 다시 풀기
                        </button>
                        <button className="btn-action"
                            style={{ background: 'transparent', color: '#94a3b8', boxShadow: 'none', border: '1.5px solid #e2e8f0', marginTop: 0 }}
                            onClick={() => setView('STUDY_HOME')}>
                            메뉴로
                        </button>
                    </div>
                )}

                {/* ── WRONG_NOTES ── */}
                {view === 'WRONG_NOTES' && (
                    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                        {/* 헤더 */}
                        <div style={{ padding: '24px 20px 16px', background: '#fff1f2', flexShrink: 0, borderBottom: '1.5px solid #fecdd3' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div>
                                    <div style={{ fontSize: 12, color: '#be123c', fontWeight: 'bold' }}>WRONG NOTES</div>
                                    <h3 style={{ margin: '4px 0 0', color: '#0f172a' }}>
                                        📚 오답 노트
                                        <span style={{ fontSize: 14, color: '#64748b', fontWeight: 400, marginLeft: 8 }}>
                                            {wrongList.length}개
                                        </span>
                                    </h3>
                                </div>
                                {wrongList.length > 0 && (
                                    <button onClick={() => { if (confirm('전체 삭제할까요?')) setWrongList([]); }}
                                        style={{ background: 'none', border: '1px solid #fca5a5', color: '#dc2626', borderRadius: 8, padding: '6px 12px', fontSize: 13, cursor: 'pointer' }}>
                                        전체 삭제
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* 목록 */}
                        <div className="scrollable" style={{ padding: 16 }}>
                            {wrongList.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '60px 0', color: '#94a3b8' }}>
                                    <div style={{ fontSize: 40, marginBottom: 12 }}>🎉</div>
                                    <div style={{ fontWeight: 'bold', fontSize: 16 }}>오답이 없어요!</div>
                                    <div style={{ fontSize: 14, marginTop: 6 }}>퀴즈를 풀면 틀린 문제가 여기 쌓여요.</div>
                                </div>
                            ) : (
                                wrongList.map(w => {
                                    const q = QUIZ_BANK.find(x => x.id === w.id);
                                    if (!q) return null;
                                    return (
                                        <div key={w.id} className="wrong-card">
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                                                <span className={`tag ${q.type === 'role' ? 'tag-role' : 'tag-concept'}`}>
                                                    {q.type === 'role' ? '코드 역할' : '개념'}
                                                </span>
                                                <button onClick={() => setWrongList(prev => prev.filter(x => x.id !== w.id))}
                                                    style={{ background: 'none', border: 'none', color: '#cbd5e1', fontSize: 18, cursor: 'pointer', padding: 0 }}>
                                                    ✕
                                                </button>
                                            </div>

                                            {q.code && (
                                                <div className="code-block" style={{ fontSize: 12, marginBottom: 10 }}>{q.code}</div>
                                            )}

                                            <p style={{ fontWeight: 700, fontSize: 14, margin: '0 0 10px', lineHeight: 1.5 }}>{q.q}</p>

                                            <div style={{ background: '#dcfce7', borderRadius: 10, padding: '10px 14px', fontSize: 13, color: '#15803d' }}>
                                                <span style={{ fontWeight: 'bold' }}>✅ 정답: </span>{q.opts[q.ans]}
                                            </div>

                                            <div style={{ background: '#f0f9ff', borderLeft: '3px solid #0ea5e9', borderRadius: '0 8px 8px 0', padding: '10px 14px', marginTop: 8, fontSize: 13, color: '#0c4a6e', lineHeight: 1.6 }}>
                                                {q.exp}
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* 하단 버튼 */}
                        <div style={{ padding: '10px 20px 20px', flexShrink: 0 }}>
                            {wrongList.length > 0 && (
                                <button className="btn-action" style={{ marginBottom: 0, marginLeft: 0, marginRight: 0, width: '100%' }}
                                    onClick={() => startQuiz('wrong')}>
                                    🔄 오답만 다시 풀기
                                </button>
                            )}
                            <button className="btn-action"
                                style={{ background: 'transparent', color: '#94a3b8', boxShadow: 'none', border: '1.5px solid #e2e8f0', marginTop: 8, marginLeft: 0, marginRight: 0, width: '100%' }}
                                onClick={() => setView('STUDY_HOME')}>
                                ← 뒤로
                            </button>
                        </div>
                    </div>
                )}

            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
